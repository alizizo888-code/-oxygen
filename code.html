<text fill="#64748B" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" text-anchor="end" x="165" y="56">أكسجين للصيانة والمقاولات</text>

</div>

        </p>

</div>
<!-- Box 4 (Empty) -->
<div class="w-14 h-16 rounded-2xl bg-slate-50/70 border-2 border-slate-200 flex items-center justify-center text-2xl font-bold text-slate-400 transition-all">

<span>تأكيد ومتابعة</span>

<!-- Key 8 -->

            8
